<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quản Lý Ngân Hàng Câu Hỏi | RobotWar</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8 bg-[#FAF8F5] text-[#18181B] font-['Plus_Jakarta_Sans',sans-serif]">

  <div class="content-container max-w-6xl mx-auto">
    <!-- Top Bar -->
    <div class="taste-card p-4 md:p-5 bg-white flex flex-wrap items-center justify-between gap-4 mb-6">
      <div>
        <a href="/" class="text-xs text-[#52525B] hover:text-[#18181B] font-bold px-2 py-1 bg-[#F4EFE6] rounded-lg border border-[#18181B] inline-flex items-center gap-1 mb-2 transition">
          &larr; Về Trang Chủ
        </a>
        <h1 class="text-xl md:text-2xl font-black text-[#18181B] uppercase tracking-tight flex items-center gap-2">
          <span>⚙️</span> QUẢN TRỊ BỘ CÂU HỎI TRẮC NGHIỆM
        </h1>
        <p class="text-xs text-[#52525B] font-semibold">Tạo, chỉnh sửa và quản lý các gói câu hỏi cho đấu trường RobotWar</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <button id="btn-export-all" class="btn-sound-toggle text-xs py-2 px-3">
          📥 Xuất JSON
        </button>
        <label class="btn-sound-toggle text-xs py-2 px-3 cursor-pointer">
          📤 Nhập JSON
          <input type="file" id="file-import" accept=".json" class="hidden">
        </label>
        <button id="btn-new-quiz" class="btn-cyber btn-start text-xs py-2 px-4 font-black">
          + Tạo Bộ Câu Hỏi Mới
        </button>
      </div>
    </div>

    <!-- Layout: 2 Columns (Quiz List & Quiz Editor) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Left: Quiz Sets List -->
      <div class="taste-card p-5 lg:col-span-1 bg-white">
        <h2 class="text-base font-black text-[#18181B] mb-4 flex items-center justify-between">
          <span>DANH SÁCH BỘ ĐỀ</span>
          <span id="quiz-count-badge" class="text-xs px-2.5 py-0.5 rounded-full bg-[#E0F2FE] text-[#0369A1] border border-[#18181B] font-bold">0 bộ</span>
        </h2>
        
        <div id="quiz-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-1">
          <!-- Populated by JS -->
          <div class="text-[#52525B] text-sm italic font-medium">Đang tải danh sách...</div>
        </div>
      </div>

      <!-- Right: Quiz Detail & Questions Editor -->
      <div class="taste-card p-6 lg:col-span-2 bg-white">
        <div id="editor-empty" class="text-center py-20 text-[#52525B]">
          <p class="text-base font-bold">Chọn một bộ câu hỏi từ danh sách bên trái hoặc tạo mới để chỉnh sửa.</p>
        </div>

        <div id="editor-container" class="hidden space-y-6">
          <!-- Quiz Info Header -->
          <div class="border-b-2 border-[#18181B] pb-4">
            <div class="flex items-center justify-between gap-4 mb-4">
              <span class="text-xs font-black text-[#B45309] bg-[#FEF3C7] border border-[#18181B] px-3 py-1 rounded-full tracking-wider uppercase">Chỉnh Sửa Bộ Đề</span>
              <div class="flex items-center gap-2">
                <button id="btn-delete-quiz" class="text-xs px-3 py-1.5 rounded-xl bg-[#FFE4E6] text-[#BE123C] border-2 border-[#18181B] hover:bg-[#FECDD3] font-black shadow-[2px_2px_0px_#18181B]">
                  Xóa Bộ Đề
                </button>
                <button id="btn-save-quiz" class="btn-cyber btn-start text-xs py-1.5 px-4 font-black">
                  💾 Lưu Thay Đổi
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="md:col-span-2">
                <label class="block text-xs font-black text-[#18181B] mb-1">Tiêu Đề Bộ Câu Hỏi:</label>
                <input type="text" id="quiz-title" class="w-full bg-[#FAF8F5] border-2 border-[#18181B] rounded-xl px-3 py-2 text-sm text-[#18181B] font-bold focus:bg-white focus:outline-none shadow-[2px_2px_0px_#18181B]">
              </div>
              <div>
                <label class="block text-xs font-black text-[#18181B] mb-1">Thời Gian Mỗi Câu (Giây):</label>
                <input type="number" id="quiz-time" min="5" max="60" value="15" class="w-full bg-[#FAF8F5] border-2 border-[#18181B] rounded-xl px-3 py-2 text-sm text-[#18181B] font-bold focus:bg-white focus:outline-none shadow-[2px_2px_0px_#18181B]">
              </div>
            </div>

            <div class="mt-3">
              <label class="block text-xs font-black text-[#18181B] mb-1">Mô Tả Ngắn:</label>
              <input type="text" id="quiz-desc" class="w-full bg-[#FAF8F5] border-2 border-[#18181B] rounded-xl px-3 py-2 text-sm text-[#18181B] font-bold focus:bg-white focus:outline-none shadow-[2px_2px_0px_#18181B]">
            </div>
          </div>

          <!-- Questions List Section -->
          <div>
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-md font-black text-[#18181B]">
                Danh Sách Câu Hỏi (<span id="questions-count">0</span>)
              </h3>
              <button id="btn-add-question" class="btn-cyber text-xs py-1.5 px-3 bg-[#DCFCE7] text-[#15803D] border-2 border-[#18181B] font-black">
                + Thêm Câu Hỏi Mới
              </button>
            </div>

            <div id="questions-accordion" class="space-y-4 max-h-[480px] overflow-y-auto pr-2">
              <!-- Question items populated by JS -->
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="/js/audio-fx.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
