<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quản Lý Ngân Hàng Câu Hỏi | RobotWar</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8">

  <div class="content-container max-w-6xl mx-auto">
    <!-- Top Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div>
        <a href="/" class="text-xs text-slate-400 hover:text-cyan-400 flex items-center gap-1 mb-1">
          &larr; Về Trang Chủ
        </a>
        <h1 class="text-2xl md:text-3xl font-black text-amber-400 uppercase tracking-wider flex items-center gap-2">
          <span>⚙️</span> QUẢN TRỊ BỘ CÂU HỎI TRẮC NGHIỆM
        </h1>
        <p class="text-sm text-slate-400">Tạo, chỉnh sửa và quản lý các gói câu hỏi cho chiến trường RobotWar</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <button id="btn-export-all" class="btn-cyber bg-slate-800 text-xs py-2 px-3 border-slate-600">
          📥 Xuất Toàn Bộ (JSON)
        </button>
        <label class="btn-cyber bg-slate-800 text-xs py-2 px-3 border-slate-600 cursor-pointer">
          📤 Nhập File (JSON)
          <input type="file" id="file-import" accept=".json" class="hidden">
        </label>
        <button id="btn-new-quiz" class="btn-cyber btn-start text-xs py-2 px-4">
          + Tạo Bộ Câu Hỏi Mới
        </button>
      </div>
    </div>

    <!-- Layout: 2 Columns (Quiz List & Quiz Editor) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Left: Quiz Sets List -->
      <div class="cyber-panel p-5 lg:col-span-1">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center justify-between">
          <span>DANH SÁCH BỘ ĐỀ</span>
          <span id="quiz-count-badge" class="text-xs px-2 py-0.5 rounded bg-slate-800 text-cyan-400">0 bộ</span>
        </h2>
        
        <div id="quiz-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-1">
          <!-- Populated by JS -->
          <div class="text-slate-500 text-sm italic">Đang tải danh sách...</div>
        </div>
      </div>

      <!-- Right: Quiz Detail & Questions Editor -->
      <div class="cyber-panel p-6 lg:col-span-2">
        <div id="editor-empty" class="text-center py-20 text-slate-500">
          <p class="text-lg">Chọn một bộ câu hỏi từ danh sách bên trái hoặc tạo mới để chỉnh sửa.</p>
        </div>

        <div id="editor-container" class="hidden space-y-6">
          <!-- Quiz Info Header -->
          <div class="border-b border-slate-800 pb-4">
            <div class="flex items-center justify-between gap-4 mb-4">
              <span class="text-xs font-bold text-amber-400 tracking-wider uppercase">Chỉnh Sửa Bộ Đề</span>
              <div class="flex items-center gap-2">
                <button id="btn-delete-quiz" class="text-xs px-3 py-1.5 rounded bg-rose-950 text-rose-400 border border-rose-800 hover:bg-rose-900">
                  Xóa Bộ Đề
                </button>
                <button id="btn-save-quiz" class="btn-cyber text-xs py-1.5 px-4">
                  💾 Lưu Thay Đổi
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tiêu Đề Bộ Câu Hỏi:</label>
                <input type="text" id="quiz-title" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Thời Gian Mỗi Câu (Giây):</label>
                <input type="number" id="quiz-time" min="5" max="60" value="15" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none">
              </div>
            </div>

            <div class="mt-3">
              <label class="block text-xs font-semibold text-slate-400 mb-1">Mô Tả Ngắn:</label>
              <input type="text" id="quiz-desc" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none">
            </div>
          </div>

          <!-- Questions List Section -->
          <div>
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-md font-bold text-slate-200">
                Danh Sách Câu Hỏi (<span id="questions-count">0</span>)
              </h3>
              <button id="btn-add-question" class="btn-cyber text-xs py-1.5 px-3 bg-emerald-700 border-emerald-500">
                + Thêm Câu Hỏi Mới
              </button>
            </div>

            <div id="questions-accordion" class="space-y-4 max-h-[480px] overflow-y-auto pr-2">
              <!-- Question items populated by JS -->
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="/js/audio-fx.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
